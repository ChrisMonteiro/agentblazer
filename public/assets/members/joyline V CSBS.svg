<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060E"/>
      <stop offset="40%" stop-color="#080D1E"/>
      <stop offset="80%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>

    <!-- Glowing Rim Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#D97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="750" fill="url(#bgGrad)" rx="32"/>
  <rect width="600" height="750" fill="url(#cyberGrid)" rx="32"/>
  <circle cx="300" cy="300" r="280" fill="url(#centerGlow)"/>

  <!-- Outer Border Frame -->
  <rect x="8" y="8" width="584" height="734" rx="26" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="14" y="14" width="572" height="722" rx="22" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.4"/>

  <!-- Top Header Bar -->
  <g transform="translate(32, 42)">
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#F59E0B"/>
    <text x="22" y="11" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="2">
      AGENTBLAZER CLUB // OFFICIAL ID
    </text>
    <text x="536" y="11" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#64748B" letter-spacing="1">
      SJEC MANGALORE
    </text>
  </g>

  <!-- Corner Tech Accents -->
  <path d="M 28 60 L 28 28 L 60 28" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 572 60 L 572 28 L 540 28" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 28 690 L 28 722 L 60 722" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 572 690 L 572 722 L 540 722" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Member Portrait Ring -->
  <g transform="translate(300, 270)">
    <!-- Outer Decorative Orbit -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="8 6" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="136" fill="none" stroke="#EAB308" stroke-width="2" stroke-opacity="0.6"/>
    
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="124" fill="#0A0F24" stroke="url(#accentGrad)" stroke-width="4" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="122" fill="#070C1B"/>

    <!-- Avatar Stylized Silhouette -->
    <!-- Head -->
    <circle cx="0" cy="-28" r="46" fill="url(#accentGrad)" fill-opacity="0.9"/>
    <!-- Torso / Shoulders -->
    <path d="M -75 92 C -75 42, -50 20, 0 20 C 50 20, 75 42, 75 92 Z" fill="url(#accentGrad)" fill-opacity="0.85"/>

    <!-- Inner Initials Badge Shield -->
    <circle cx="0" cy="-28" r="32" fill="#04060E" fill-opacity="0.85"/>
    <text x="0" y="-17" text-anchor="middle" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      JG
    </text>

    <!-- Verified Member Badge Pill -->
    <g transform="translate(0, 126)">
      <rect x="-90" y="-15" width="180" height="30" rx="15" fill="#030712" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="-68" cy="0" r="4" fill="#F59E0B"/>
      <text x="-56" y="4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#F59E0B" letter-spacing="1">
        VERIFIED MEMBER
      </text>
    </g>
  </g>

  <!-- Member Information Details -->
  <g transform="translate(300, 485)">
    <!-- Tag Category Badge -->
    <rect x="-160" y="-18" width="320" height="28" rx="14" fill="rgba(245, 158, 11, 0.15)" stroke="#F59E0B" stroke-width="1"/>
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="800" fill="#F59E0B" letter-spacing="2">
      SECRETARY • CSBS
    </text>

    <!-- Full Member Name -->
    <text x="0" y="48" text-anchor="middle" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      Joyline Galbao
    </text>

    <!-- Role Designation -->
    <text x="0" y="78" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="700" fill="#F59E0B">
      Secretary
    </text>

    <!-- Department & Specialization -->
    <text x="0" y="108" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
      Dept of Computer Science & Business Systems (CSBS)
    </text>
    
    <!-- Batch / College Details -->
    <text x="0" y="132" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748B">
      Club Administration & Governance
    </text>
  </g>

  <!-- Card Footer Security & Authenticity Bar -->
  <g transform="translate(32, 690)">
    <line x1="0" y1="0" x2="536" y2="0" stroke="#1E293B" stroke-width="1"/>
    <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#475569" letter-spacing="1">
      ST JOSEPH ENGINEERING COLLEGE
    </text>
    <text x="536" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#F59E0B">
      AUTHENTICATED // 2025–26
    </text>
  </g>
</svg>