<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient inside Hexagon -->
    <radialGradient id="hexInnerBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#140A26" />
      <stop offset="60%" stop-color="#070312" />
      <stop offset="100%" stop-color="#020106" />
    </radialGradient>

    <!-- Outer Hexagon Violet/Pink Glow -->
    <linearGradient id="neonPurpleGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Metallic Gold Flame Gradient -->
    <linearGradient id="goldFlameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400E" />
      <stop offset="25%" stop-color="#D97706" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <!-- Dark Chrome Plume Gradient -->
    <linearGradient id="darkChromeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B0914" />
      <stop offset="45%" stop-color="#1F1D2B" />
      <stop offset="80%" stop-color="#38354A" />
      <stop offset="100%" stop-color="#5B5673" />
    </linearGradient>

    <!-- Cyan Circuit Gradient -->
    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Magenta Circuit Gradient -->
    <linearGradient id="magentaLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="hexSoftGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Intense Core Glow Filter -->
    <filter id="coreGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Hexagon Interior Clip Path -->
    <clipPath id="innerHexClip">
      <polygon points="250,42 421,141 421,339 250,438 79,339 79,141" />
    </clipPath>
  </defs>

  <!-- 1. Ambient Outer Violet Glow -->
  <polygon
    points="250,40 423,140 423,340 250,440 77,340 77,140"
    fill="none"
    stroke="url(#neonPurpleGlowGrad)"
    stroke-width="26"
    stroke-linejoin="round"
    opacity="0.65"
    filter="url(#hexSoftGlow)"
  />

  <polygon
    points="250,40 423,140 423,340 250,440 77,340 77,140"
    fill="none"
    stroke="#C084FC"
    stroke-width="14"
    stroke-linejoin="round"
    opacity="0.75"
  />

  <!-- 2. The Signature Crisp White Hexagonal Frame -->
  <polygon
    points="250,40 423,140 423,340 250,440 77,340 77,140"
    fill="url(#hexInnerBg)"
    stroke="#FFFFFF"
    stroke-width="7"
    stroke-linejoin="round"
  />

  <!-- 3. Hexagon Interior (Clipped) -->
  <g clip-path="url(#innerHexClip)">
    <!-- Inner Purple Rim Accent -->
    <polygon
      points="250,48 415,144 415,336 250,432 85,336 85,144"
      fill="none"
      stroke="#9333EA"
      stroke-width="2.5"
      opacity="0.6"
    />

    <!-- Cyber Matrix Background: Microchips & Dense Circuit Traces -->
    <!-- Magenta / Pink Left-Side Circuit Grid -->
    <g opacity="0.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 115 150 L 115 330" stroke="url(#magentaLineGrad)" stroke-width="2.5" />
      <path d="M 115 190 L 140 215 L 140 270" stroke="url(#magentaLineGrad)" stroke-width="2" />
      <circle cx="140" cy="270" r="3.5" fill="#F43F5E" />
      
      <path d="M 115 250 L 98 267 L 98 310" stroke="url(#magentaLineGrad)" stroke-width="2" />
      <circle cx="98" cy="310" r="3" fill="#E11D48" />

      <path d="M 130 145 L 130 175 L 155 200" stroke="url(#magentaLineGrad)" stroke-width="1.8" />
      <circle cx="155" cy="200" r="2.5" fill="#EC4899" />

      <path d="M 115 295 L 135 315 L 150 315" stroke="url(#magentaLineGrad)" stroke-width="1.8" />
      <circle cx="150" cy="315" r="2.5" fill="#F43F5E" />

      <!-- Micro IC Chip Block on Left -->
      <rect x="100" y="210" width="18" height="26" rx="2" fill="#0D061C" stroke="#E11D48" stroke-width="1.2" />
      <line x1="96" y1="216" x2="100" y2="216" stroke="#E11D48" stroke-width="1.2" />
      <line x1="96" y1="223" x2="100" y2="223" stroke="#E11D48" stroke-width="1.2" />
      <line x1="96" y1="230" x2="100" y2="230" stroke="#E11D48" stroke-width="1.2" />
      <line x1="118" y1="216" x2="122" y2="216" stroke="#E11D48" stroke-width="1.2" />
      <line x1="118" y1="223" x2="122" y2="223" stroke="#E11D48" stroke-width="1.2" />
      <line x1="118" y1="230" x2="122" y2="230" stroke="#E11D48" stroke-width="1.2" />
    </g>

    <!-- Cyan Right-Side Circuit Grid -->
    <g opacity="0.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 385 150 L 385 330" stroke="url(#cyanLineGrad)" stroke-width="2.5" />
      <path d="M 385 205 L 360 230 L 360 280" stroke="url(#cyanLineGrad)" stroke-width="2" />
      <circle cx="360" cy="280" r="3.5" fill="#00F0FF" />

      <path d="M 385 265 L 402 282 L 402 315" stroke="url(#cyanLineGrad)" stroke-width="2" />
      <circle cx="402" cy="315" r="3" fill="#38BDF8" />

      <path d="M 370 145 L 370 175 L 348 197" stroke="url(#cyanLineGrad)" stroke-width="1.8" />
      <circle cx="348" cy="197" r="2.5" fill="#00F0FF" />

      <path d="M 385 175 L 405 195 L 405 230" stroke="url(#cyanLineGrad)" stroke-width="1.8" />
      <circle cx="405" cy="230" r="2.5" fill="#0284C7" />

      <!-- Micro IC Chip Block on Right -->
      <rect x="382" y="210" width="18" height="26" rx="2" fill="#0D061C" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="378" y1="216" x2="382" y2="216" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="378" y1="223" x2="382" y2="223" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="378" y1="230" x2="382" y2="230" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="400" y1="216" x2="404" y2="216" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="400" y1="223" x2="404" y2="223" stroke="#00F0FF" stroke-width="1.2" />
      <line x1="400" y1="230" x2="404" y2="230" stroke="#00F0FF" stroke-width="1.2" />
    </g>

    <!-- Top & Bottom Micro Busses -->
    <g opacity="0.4" stroke-linecap="round">
      <line x1="180" y1="110" x2="220" y2="110" stroke="#EC4899" stroke-width="1.5" />
      <circle cx="220" cy="110" r="2" fill="#EC4899" />
      <line x1="320" y1="110" x2="280" y2="110" stroke="#00F0FF" stroke-width="1.5" />
      <circle cx="280" cy="110" r="2" fill="#00F0FF" />

      <line x1="180" y1="390" x2="210" y2="390" stroke="#EC4899" stroke-width="1.5" />
      <line x1="320" y1="390" x2="290" y2="390" stroke="#00F0FF" stroke-width="1.5" />
    </g>

    <!-- 4. The Flame-Eye Emblem & Circuit Tree (Centerpiece) -->

    <!-- Right Side: Branching Golden & Cyan Circuit Tree -->
    <g stroke-linecap="round" stroke-linejoin="round">
      <!-- Upper Golden Circuit Traces -->
      <path d="M 270 215 L 305 200 L 332 200" stroke="url(#goldFlameGrad)" stroke-width="3" />
      <circle cx="332" cy="200" r="4.5" fill="#FDE047" filter="url(#coreGlow)" />

      <path d="M 275 235 L 315 235 L 332 252 L 350 252" stroke="url(#goldFlameGrad)" stroke-width="3.2" />
      <circle cx="350" cy="252" r="5" fill="#FDE047" filter="url(#coreGlow)" />

      <path d="M 270 255 L 298 283 L 324 283 L 340 299" stroke="url(#goldFlameGrad)" stroke-width="3.2" />
      <circle cx="340" cy="299" r="5" fill="#FDE047" filter="url(#coreGlow)" />

      <!-- Lower Cyan Circuit Traces -->
      <path d="M 256 278 L 285 307 L 285 336 L 302 353" stroke="url(#cyanLineGrad)" stroke-width="3.2" />
      <circle cx="302" cy="353" r="4.5" fill="#00F0FF" filter="url(#coreGlow)" />

      <path d="M 244 285 L 258 322 L 258 360 L 272 374" stroke="url(#cyanLineGrad)" stroke-width="3.2" />
      <circle cx="272" cy="374" r="4.5" fill="#00F0FF" filter="url(#coreGlow)" />

      <path d="M 235 285 L 235 335 L 222 358 L 222 384" stroke="url(#cyanLineGrad)" stroke-width="3" />
      <circle cx="222" cy="384" r="4" fill="#00F0FF" filter="url(#coreGlow)" />

      <!-- Intermediate Gold Sub-branches -->
      <path d="M 315 235 L 326 224 L 342 224" stroke="url(#goldFlameGrad)" stroke-width="2.2" />
      <circle cx="342" cy="224" r="3.2" fill="#FDE047" />

      <path d="M 298 283 L 312 297 L 312 318" stroke="url(#goldFlameGrad)" stroke-width="2.2" />
      <circle cx="312" cy="318" r="3.2" fill="#F59E0B" />

      <!-- Cyan Sub-branches -->
      <path d="M 285 336 L 270 351 L 270 370" stroke="url(#cyanLineGrad)" stroke-width="2.2" />
      <circle cx="270" cy="370" r="3" fill="#38BDF8" />
    </g>

    <!-- Left & Center: Stylized Dark Chrome & Radiant Gold Flame Crest -->
    <g>
      <!-- Dark Charcoal Back-Plume Shadow -->
      <path
        d="M 252 105 C 262 138 276 168 286 198 C 272 188 256 182 245 182 C 254 162 256 140 252 105 Z"
        fill="url(#darkChromeGrad)"
        stroke="#475569"
        stroke-width="1.2"
        opacity="0.95"
      />

      <!-- Tall Central Gold Flame Spire -->
      <path
        d="M 248 88 C 256 132 282 172 302 208 C 286 198 270 193 255 193 C 270 162 266 126 248 88 Z"
        fill="url(#goldFlameGrad)"
        stroke="#FEF08A"
        stroke-width="1"
        filter="url(#hexSoftGlow)"
      />

      <!-- Secondary Left Upper Plume -->
      <path
        d="M 222 126 C 238 156 248 190 250 220 C 238 210 222 205 208 205 C 222 180 225 155 222 126 Z"
        fill="url(#goldFlameGrad)"
        stroke="#FEF08A"
        stroke-width="1"
      />

      <!-- Third Outer Left Plume -->
      <path
        d="M 190 165 C 210 190 220 220 220 240 C 205 230 190 230 176 233 C 190 210 193 190 190 165 Z"
        fill="url(#goldFlameGrad)"
        stroke="#FEF08A"
        stroke-width="1"
      />

      <!-- Majestic Swooping Flame Wing embracing the lower-left Eye -->
      <path
        d="M 170 234 C 190 214 225 204 250 209 C 225 219 200 244 200 279 C 180 269 165 254 170 234 Z"
        fill="url(#goldFlameGrad)"
        stroke="#FEF08A"
        stroke-width="1.2"
      />

      <!-- Dark inner contour shadow for 3D depth -->
      <path
        d="M 226 208 C 214 222 206 240 206 262 C 200 252 196 240 200 226 C 208 216 216 210 226 208 Z"
        fill="#0B0914"
        opacity="0.7"
      />
    </g>

    <!-- Center: The Cybernetic All-Seeing Eye -->
    <g transform="translate(242, 250)">
      <!-- Outer Golden Almond Eye Contour -->
      <path
        d="M -48 0 C -26 -28 26 -28 48 0 C 26 28 -26 28 -48 0 Z"
        fill="#080314"
        stroke="url(#goldFlameGrad)"
        stroke-width="4.5"
      />

      <!-- Upper Eyebrow Arch -->
      <path
        d="M -42 -10 C -20 -34 20 -34 42 -10"
        fill="none"
        stroke="url(#goldFlameGrad)"
        stroke-width="2.5"
        stroke-linecap="round"
      />

      <!-- Iris Cyan Outer Ring (Glowing) -->
      <circle cx="0" cy="0" r="18" fill="none" stroke="#00F0FF" stroke-width="2.8" filter="url(#coreGlow)" />

      <!-- Iris Dark Cavity -->
      <circle cx="0" cy="0" r="13" fill="#110526" />

      <!-- Iris Tick Marks -->
      <line x1="-16" y1="0" x2="-12" y2="0" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="16" y1="0" x2="12" y2="0" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="0" y1="-16" x2="0" y2="-12" stroke="#00F0FF" stroke-width="1.5" />
      <line x1="0" y1="16" x2="0" y2="12" stroke="#00F0FF" stroke-width="1.5" />

      <!-- Pupil Center Spark -->
      <circle cx="0" cy="0" r="6.5" fill="#00F0FF" filter="url(#coreGlow)" />
      <!-- Specular Highlight (Pure White Sparkle) -->
      <circle cx="-2.5" cy="-2.5" r="2.8" fill="#FFFFFF" />
    </g>

    <!-- Lower Core Emitter Node -->
    <g transform="translate(242, 304)">
      <!-- Outer Cyan Glowing Ring -->
      <circle cx="0" cy="0" r="11" fill="#080318" stroke="#00F0FF" stroke-width="3" filter="url(#coreGlow)" />
      <!-- Inner Glowing Core -->
      <circle cx="0" cy="0" r="5" fill="#00F0FF" />
      <!-- White Center Node -->
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>
</svg>
